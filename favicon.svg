<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Plate -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" fill="url(#glowGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  
  <!-- Industrial Forms / Factory Archive Icon -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Document Folder / Binder Tab -->
    <path d="M18 19h28a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Main Form Drawer / Container -->
    <path d="M16 27h32v18a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V27z" />
    <!-- Center Handle -->
    <path d="M26 35h12" stroke-width="4" stroke="#ffffff" />
    <!-- Header Pin Indicator -->
    <path d="M27 15h10" stroke-width="3" stroke="#a7f3d0" />
  </g>
  
  <!-- Emerald Status Pulse Dot -->
  <circle cx="45" cy="19" r="2.2" fill="#34d399" />
</svg>
